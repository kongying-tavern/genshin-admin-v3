      <path d="M8 0h104a8 8 0 0 1 8 8v14H0V8a8 8 0 0 1 8-8z" fill="#405065" />
      <path d="m106 8 6 6m0-6-6 6" stroke="#e4dbca" stroke-width="1.3" stroke-linecap="round" />
    </g>
  </defs>

  <path d="M0 0h320v144H0z" fill="url(#map)" />
  <path d="M0 0h320v144H0z" fill="url(#grid)" />
  <path
