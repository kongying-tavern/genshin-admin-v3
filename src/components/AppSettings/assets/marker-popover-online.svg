    <path d="M13 144c28-17 39-46 67-46 24 0 33 17 54 18m52 5c26 0 43-26 63-29 24-4 41 7 68-5" />
    <path d="M38 144c18-20 29-35 48-35 12 0 26 8 37 12m77 17c20-6 30-26 51-33 22-7 44 6 63-5" />
  </g>
  <path d="M80 121c70 1 95-22 160 0" stroke="#bddeb8" stroke-opacity=".32" stroke-dasharray="2 5" stroke-linecap="round" />
  <circle cx="80" cy="121" r="8" stroke="#c6c4b4" stroke-opacity=".4" />
  <path d="m80 117 4 4-4 4-4-4z" fill="#c6c4b4" />
  <circle cx="240" cy="121" r="13" fill="#bde0b6" fill-opacity=".13" />
