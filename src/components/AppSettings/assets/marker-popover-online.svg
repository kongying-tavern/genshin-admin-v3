<svg xmlns="http://www.w3.org/2000/svg" width="320" height="144" viewBox="0 0 320 144" fill="none">
  <title>开启高新鲜度模式</title>
  <desc>点击单个点位后向服务端核对，弹窗在等待时显示骨架屏，核对后显示最新详情。</desc>
  <defs>
    <linearGradient id="map" x1="10" y1="0" x2="310" y2="144" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2b3d4b" />
      <stop offset="1" stop-color="#17232f" />
    </linearGradient>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0v16" stroke="#b0c1cd" stroke-opacity=".09" />
    </pattern>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="90" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f2ebde" />
      <stop offset="1" stop-color="#dcd3c3" />
    </linearGradient>
    <linearGradient id="skeleton" x1="10" y1="0" x2="109" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c0b7a8" />
      <stop offset=".63" stop-color="#cec5b7" />
      <stop offset="1" stop-color="#bdb4a5" />
    </linearGradient>
    <filter id="shadow" x="-25%" y="-20%" width="150%" height="160%">
