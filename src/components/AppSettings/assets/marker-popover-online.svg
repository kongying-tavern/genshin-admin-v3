    <circle cx="14" cy="11" r="4.5" stroke="#d7cbb6" stroke-opacity=".35" stroke-width="1.3" />
    <path d="M14 6.5a4.5 4.5 0 0 1 4.5 4.5" stroke="#e8d0a3" stroke-width="1.3" stroke-linecap="round" />
