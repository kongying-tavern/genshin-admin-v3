        --muted: #354256;
        --line: #516179;
        --text: #edf4fd;
        --subtle: #becce0;
        --accent: #327bcf;
      }
    }
  </style>
  <rect width="184" height="80" fill="var(--canvas)" />
  <rect x="9.5" y="6.5" width="165" height="67" rx="5.5" fill="var(--panel)" stroke="var(--line)" />
  <path d="M15 7h154a5 5 0 0 1 5 5v10H10V12a5 5 0 0 1 5-5z" fill="var(--muted)" />
  <path d="M10 22h164" stroke="var(--line)" />
