name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm 版本取自 package.json 的 packageManager 字段
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          # 缓存 pnpm store，key 由 pnpm-lock.yaml 的哈希决定
          cache: pnpm

      # 锁文件已入库，用 --frozen-lockfile 保证 CI 与本地解析完全一致
      # 注意：wgsl_reflect 由 package.json 的 pnpm.overrides 固定在 1.2.3，
      # 其 >=1.3.0 版本声明 type: module 但 main 仍指向 CJS 产物，Node 侧具名导入会直接抛 SyntaxError
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 集成测试（tests/api/integration）会直连 dev 后端并写入数据，留给本地/后续流水线
      - name: Run unit and api-contract tests
        run: pnpm run test:run --project unit --project api-contract
